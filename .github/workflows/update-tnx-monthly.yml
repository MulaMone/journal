name: update-tnx-monthly
on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/update_tnx_monthly.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/tnx_monthly.json
          git diff --cached --quiet || (git commit -m "update tnx_monthly.json" && git push)
