name: update-energy
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: update-energy
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PJM_API_KEY: ${{ secrets.PJM_API_KEY }}
        run: python scripts/fetch_energy.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add energy.json energy_norms.json
          git diff --cached --quiet || (git commit -m "energy data" && git pull --rebase -q && git push)
