name: update-long-monthly
on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * 5"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_long_monthly.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/dxy_monthly.json data/cl_monthly.json
          git diff --cached --quiet || (git commit -m "Update DXY/CL monthly history" && git push)
