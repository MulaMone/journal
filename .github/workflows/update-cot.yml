name: update-cot

on:
  workflow_dispatch:
  schedule:
    # CFTC releases Fridays 3:30pm ET (19:30 UTC in EDT, 20:30 in EST); Monday
    # covers holiday-delayed weeks. GitHub cron can skip runs — Trigger All
    # in the app dispatches this on demand.
    - cron: "*/10 19-23 * * 5"
    - cron: "*/10 19-23 * * 1"

concurrency:
  group: update-cot

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch COT
        run: python scripts/fetch-cot.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cot.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "update cot.json"
            git pull --rebase
            git push
          fi
