name: update-cot

on:
  workflow_dispatch:
  schedule:
    # Fridays only, two runs after the 3:30pm ET CFTC release. Times are UTC
    # and chosen to land after the release in both EDT and EST:
    #   20:45 UTC = 4:45pm EDT / 3:45pm EST
    #   22:00 UTC = 6:00pm EDT / 5:00pm EST (retry)
    # GitHub cron can run late or skip — Trigger All in the app is the backup.
    - cron: "45 20 * * 5"
    - cron: "0 22 * * 5"

concurrency:
  group: update-cot

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch COT
        run: python scripts/fetch-cot.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cot.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "update cot.json"
            git pull --rebase
            git push
          fi
