name: Update Treasury yield curve data

on:
  schedule:
    # Treasury publishes once/day around 3:30pm ET. Two runs (20:45 and
    # 21:45 UTC) cover both EST and EDT without needing to change the cron
    # twice a year. Weekdays only — no new print on weekends.
    - cron: "45 20 * * 1-5"
    - cron: "45 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and build yields.json
        run: python3 scripts/update_yields.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yields.json
          git diff --cached --quiet || git commit -m "chore: update yield curve data"
          git push
