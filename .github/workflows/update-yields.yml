name: Update Treasury yield curve data

on:
  schedule:
    # Treasury publishes once/day around 3:30pm ET. Two runs (20:45 and
    # 21:45 UTC) cover both EST and EDT without needing to change the cron
    # twice a year. Weekdays only — no new print on weekends.
    - cron: "45 20 * * 1-5"
    - cron: "45 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and build yields.json
        run: python3 scripts/update_yields.py

      - name: Commit and push (with retry on race with other workflows)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yields.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update yield curve data"
            # Multiple data-fetch workflows can run around the same time and
            # each push to main independently — pull --rebase first so this
            # push always lands on top of whatever the others already
            # committed, instead of getting rejected as a non-fast-forward.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push attempt $i failed, retrying..."
              sleep 3
            done
          else
            echo "yields.json unchanged — nothing to commit"
          fi
