name: Update liquidity data

on:
  schedule:
    # Thursday evening, right after the H.4.1 release (~4:30pm ET) — fires
    # twice (EDT/EST) since GitHub cron is fixed UTC. Offset to :33 to avoid
    # the :00/:15/:30/:45 high-load times.
    - cron: "33 21 * * 4"  # ~5:33pm EDT
    - cron: "33 22 * * 4"  # ~5:33pm EST
    # Friday morning catch-up — covers the case where FRED hadn't posted the
    # new print yet on Thursday evening, or the Thursday run was delayed/skipped.
    - cron: "33 12 * * 5"  # ~8:33am EDT
    - cron: "33 13 * * 5"  # ~8:33am EST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-liquidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check local time
        id: timecheck
        run: |
          python3 -c "
          from zoneinfo import ZoneInfo
          from datetime import datetime
          now = datetime.now(ZoneInfo('America/New_York'))
          # Thursday: any time from 5pm ET on (tolerates delayed runs).
          # Friday: 8:00-9:00am ET. The cron that doesn't match the current
          # DST state no-ops via this check. A run that lands twice in the
          # window is harmless — unchanged data means no commit.
          wd, h = now.weekday(), now.hour
          proceed = (wd == 3 and h >= 17) or (wd == 4 and 8 <= h < 9)
          print('local time is', now.isoformat(), '— proceed:', proceed)
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('proceed=' + ('true' if proceed else 'false') + '\n')
          "

      - name: Fetch liquidity series and write liquidity.json
        if: steps.timecheck.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/fetch-liquidity.py

      - name: Commit and push (with retry on race with other workflows)
        if: steps.timecheck.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- liquidity.json; then
            git add liquidity.json
            git commit -m "Update liquidity data"
            # Multiple data-fetch workflows can run around the same time and
            # each push to main independently — pull --rebase first so this
            # push always lands on top of whatever the others already
            # committed, instead of getting rejected as a non-fast-forward.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push attempt $i failed, retrying..."
              sleep 3
            done
          else
            echo "liquidity.json unchanged — nothing to commit"
          fi
