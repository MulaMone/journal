name: Update TNX daily OHLC

on:
  schedule:
    # Weekdays after the US close (covers EST and EDT)
    - cron: "40 20 * * 1-5"
    - cron: "40 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tnx-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ^TNX daily OHLC (3y)
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, zoneinfo, sys
          url = "https://query1.finance.yahoo.com/v8/finance/chart/%5ETNX?interval=1d&range=3y"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          data = json.load(urllib.request.urlopen(req, timeout=30))
          res = data["chart"]["result"][0]
          ts = res["timestamp"]; q = res["indicators"]["quote"][0]
          et = zoneinfo.ZoneInfo("America/New_York")
          rows = {}
          for i, t in enumerate(ts):
              o, h, l, c = q["open"][i], q["high"][i], q["low"][i], q["close"][i]
              if None in (o, h, l, c):
                  continue
              d = datetime.datetime.fromtimestamp(t, et).strftime("%Y-%m-%d")
              rows[d] = {"d": d, "o": round(o, 3), "h": round(h, 3), "l": round(l, 3), "c": round(c, 3)}
          out = [rows[k] for k in sorted(rows)]
          if len(out) < 50:
              sys.exit("too few rows: %d" % len(out))
          json.dump({"fetchedAt": datetime.datetime.utcnow().isoformat() + "Z", "rows": out},
                    open("data/tnx_daily.json", "w"), separators=(",", ":"))
          print("rows:", len(out), "last:", out[-1])
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tnx_daily.json
          if git diff --cached --quiet -- data/tnx_daily.json; then echo "no change"; exit 0; fi
          git commit -m "Update tnx_daily.json"
          git pull --rebase origin main
          git push
