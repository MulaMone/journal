name: Update TNX quote

on:
  schedule:
    # Fires at :07, :22, :37, :52 rather than the exact quarter-hour
    # marks — GitHub's own docs flag :00/:15/:30/:45 as high-load times
    # since every scheduled workflow on GitHub tends to cluster there,
    # which can queue/delay runs. Still every 15 min, just offset.
    # 13:07-21:52 UTC covers both EDT (9:25am-4:15pm ET) and EST
    # (9:25am-4:15pm ET) market hours as a superset; the "Check local
    # time" guard step below narrows it to the real window each run.
    - cron: "7,22,37,52 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-tnx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check local time
        id: timecheck
        run: |
          python3 -c "
          from zoneinfo import ZoneInfo
          from datetime import datetime, time
          now = datetime.now(ZoneInfo('America/New_York'))
          proceed = time(9, 25) <= now.time() <= time(16, 15)
          print('local time is', now.isoformat(), '— proceed:', proceed)
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('proceed=' + ('true' if proceed else 'false') + '\n')
          "

      - name: Fetch $TNX and write tnx.json
        if: steps.timecheck.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/fetch-tnx.py

      - name: Commit and push (with retry on race with other workflows)
        if: steps.timecheck.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- tnx.json; then
            git add tnx.json
            git commit -m "Update TNX quote"
            # Multiple data-fetch workflows can run around the same time and
            # each push to main independently — pull --rebase first so this
            # push always lands on top of whatever the others already
            # committed, instead of getting rejected as a non-fast-forward.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push attempt $i failed, retrying..."
              sleep 3
            done
          else
            echo "tnx.json unchanged — nothing to commit"
          fi
