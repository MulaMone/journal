name: Update TNX quote

on:
  schedule:
    # Every 15 minutes, 13:25-21:15 UTC — a superset covering both EDT
    # (9:25am-4:15pm ET = 13:25-20:15 UTC) and EST (9:25am-4:15pm ET =
    # 14:25-21:15 UTC) market hours, so this window is always wide enough
    # regardless of season. The "Check local time" guard step below then
    # skips any run that falls outside the real 9:25am-4:15pm ET window —
    # self-correcting across the Nov/March DST changeovers with no manual
    # cron edits ever needed.
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-tnx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check local time
        id: timecheck
        run: |
          python3 -c "
          from zoneinfo import ZoneInfo
          from datetime import datetime, time
          now = datetime.now(ZoneInfo('America/New_York'))
          proceed = time(9, 25) <= now.time() <= time(16, 15)
          print('local time is', now.isoformat(), '— proceed:', proceed)
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('proceed=' + ('true' if proceed else 'false') + '\n')
          "

      - name: Fetch $TNX and write tnx.json
        if: steps.timecheck.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/fetch-tnx.py

      - name: Commit if changed
        if: steps.timecheck.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- tnx.json; then
            git add tnx.json
            git commit -m "Update TNX quote"
            git push
          else
            echo "tnx.json unchanged — nothing to commit"
          fi
